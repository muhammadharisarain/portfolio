            - paragraph [ref=e111]: I'm a Full Stack Developer with over 4 years of professional experience at XISLABS, architecting and shipping production-grade web applications for clients across fintech, social, entertainment, and Web3. My core expertise is the MERN stack (MongoDB, Express.js, React.js, Node.js), complemented by strong command of NestJS, Next.js, and TypeScript.
